# pingtesti-socket + coturn — Dokploy (Compose) / docker compose
#
# Dokploy: Create Service → Compose → bu repo, Compose Path: ./docker-compose.yml
#   Ortam değişkeni gerekmez (TURN kullanıcı/şifre varsayılan: pingtesti / pingtesti).
#   Domains: servis "socket", port 8080, HTTPS açık
#
# coturn portları Docker tarafından yayınlanır (iptables kuralları otomatik açılır):
#   3478/udp+tcp (TURN/STUN) ve 49160-49259/udp (röle, ~50 eşzamanlı test)
# socket servisi TURN_HOST=auto ile sunucunun gerçek IP'sini kendisi bulur; ikisi aynı kullanıcı/şifreyi kullanır.
services:
  socket:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      TURN_HOST: ${TURN_HOST:-auto}
      TURN_PORT: "3478"
      TURN_USERNAME: ${TURN_USERNAME:-pingtesti}
      TURN_PASSWORD: ${TURN_PASSWORD:-pingtesti}
      ICE_POLICY: relay
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.pingtesti.com,https://pingtesti.com}
      MAX_CONN_PER_IP: "10"
    expose:
      - "8080"
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49259:49160-49259/udp"
    # Konteyner köprü ağında: röle adresleri sunucunun genel IP'siyle duyurulur ($$(detect-external-ip) imajın yardımcısı)
    command: >-
      -n --log-file=stdout --simple-log
      --listening-port=3478 --min-port=49160 --max-port=49259
      --external-ip=$$(detect-external-ip)
      --realm=pingtesti --fingerprint
      --lt-cred-mech --user=${TURN_USERNAME:-pingtesti}:${TURN_PASSWORD:-pingtesti}
      --stale-nonce=600 --total-quota=200
      --no-cli --no-tls --no-dtls --no-tcp-relay --no-multicast-peers --no-software-attribute
      --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255
      --denied-peer-ip=198.18.0.0-198.19.255.255 --denied-peer-ip=224.0.0.0-255.255.255.255
