# pingtesti-socket + coturn — Dokploy (Compose) / docker compose
#
# Dokploy: Create Service → Compose → bu repo, Compose Path: ./docker-compose.yml
#   Ortam değişkeni gerekmez (TURN kullanıcı/şifre varsayılan: pingtesti / pingtesti).
#   Domains: servis "socket", port 8080, HTTPS açık
#
# coturn portları Docker tarafından yayınlanır (iptables kuralları otomatik açılır):
#   3478/udp+tcp (TURN/STUN) ve 49160-49259/udp (röle, ~50 eşzamanlı test)
# socket servisi TURN_HOST=auto ile sunucunun gerçek IP'sini kendisi bulur; ikisi aynı kullanıcı/şifreyi kullanır.
services:
  socket:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      TURN_HOST: ${TURN_HOST:-auto}
      TURN_PORT: "3478"
      TURN_USERNAME: ${TURN_USERNAME:-pingtesti}
      TURN_PASSWORD: ${TURN_PASSWORD:-pingtesti}
      ICE_POLICY: relay
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.pingtesti.com,https://pingtesti.com}
      MAX_CONN_PER_IP: "10"
    expose:
      - "8080"
    depends_on:
      - coturn

  coturn:
    build:
      context: .
      dockerfile: docker/coturn.Dockerfile
    restart: unless-stopped
    environment:
      TURN_USERNAME: ${TURN_USERNAME:-pingtesti}
      TURN_PASSWORD: ${TURN_PASSWORD:-pingtesti}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_MIN_PORT: "49160"
      TURN_MAX_PORT: "49259"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49259:49160-49259/udp"
